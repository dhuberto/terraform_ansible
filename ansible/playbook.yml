---
- name: Provisionamento da Aplicacao Node.js com PostgreSQL
  hosts: all
  become: true
  vars_files:
    - vault.yml

  tasks:
    - name: Instalar Docker e Python3 (Amazon Linux 2023)
      ansible.builtin.dnf:
        name:
          - docker
          - python3-pip
        state: present

    - name: Instalar SDK Python para Docker
      ansible.builtin.pip:
        name: docker
        state: present
        extra_args: --ignore-installed --user

    - name: Garantir que o servico do Docker esta em execucao e habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar o usuario ec2-user ao grupo docker
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Resetar conexao para aplicar o grupo docker
      ansible.builtin.meta:
        reset_connection

    - name: Criar diretorio da aplicacao
      ansible.builtin.file:
        path: /home/ec2-user/app-nodejs
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copiar codigo da aplicacao para a EC2
      ansible.builtin.copy:
        src: ../app-nodejs/
        dest: /home/ec2-user/app-nodejs/
        owner: ec2-user
        group: ec2-user
        mode: '0755'
        force: true

    - name: Criar rede Docker app-network
      ansible.builtin.shell:
        cmd: docker network create app-network 2>/dev/null || true
      become_user: ec2-user

    - name: Executar container PostgreSQL (via shell)
      ansible.builtin.shell:
        cmd: |
          docker run -d \
            --name postgres-db \
            --network app-network \
            -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD={{ postgres_password }} \
            -e POSTGRES_DB=nomes_db \
            -v postgres_data:/var/lib/postgresql/data \
            postgres:15-alpine
      become_user: ec2-user
      ignore_errors: true

    - name: Construir imagem da aplicacao Node.js (via shell)
      ansible.builtin.shell:
        cmd: docker build -t nodejs-app /home/ec2-user/app-nodejs
      become_user: ec2-user
      ignore_errors: true

    - name: Executar container da aplicacao Node.js (via shell)
      ansible.builtin.shell:
        cmd: |
          docker run -d \
            -p 3000:3000 \
            --name nodejs-app \
            --network app-network \
            -e DB_HOST=postgres-db \
            -e DB_USER=admin \
            -e DB_PASSWORD={{ postgres_password }} \
            -e DB_NAME=nomes_db \
            -e DB_PORT=5432 \
            nodejs-app
      become_user: ec2-user
      ignore_errors: true
